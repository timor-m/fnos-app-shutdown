name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download fnpack
        run: npm run download:fnpack

      - name: Pack fpk
        run: npm run pack:fpk
        env:
          EXECUTOR_SIGNING_KEY: ${{ secrets.EXECUTOR_SIGNING_KEY }}

      - name: Prepare release notes
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package.json ($PACKAGE_VERSION)" >&2
            exit 1
          fi

          # CHANGELOG.md is the single source of truth for version-specific notes.
          awk -v version="$TAG_VERSION" '
            $0 == "## " version { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "CHANGELOG.md has no section for version $TAG_VERSION" >&2
            exit 1
          fi

          {
            echo
            echo "## Release Artifacts"
            echo
            echo "- \`dist/app.tgz\`: fnOS app payload archive"
            echo "- \`dist/*.fpk\`: installable fnOS package"
          } >> RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          name: 智能关机 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/app.tgz
            dist/*.fpk
